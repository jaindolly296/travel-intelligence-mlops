apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlflow
  namespace: travel-intelligence

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mlflow

  template:

    metadata:
      labels:
        app: mlflow

    spec:

      containers:

        - name: mlflow

          image: travel-intelligence-mlops-mlflow:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 5000

---

apiVersion: v1
kind: Service

metadata:
  name: mlflow
  namespace: travel-intelligence

spec:

  selector:
    app: mlflow

  ports:

    - port: 5000
      targetPort: 5000
      nodePort: 30002

  type: NodePort
