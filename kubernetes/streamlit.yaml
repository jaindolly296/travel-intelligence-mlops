apiVersion: apps/v1
kind: Deployment

metadata:
  name: streamlit
  namespace: travel-intelligence

spec:
  replicas: 1

  selector:
    matchLabels:
      app: streamlit

  template:

    metadata:
      labels:
        app: streamlit

    spec:

      containers:

        - name: streamlit

          image: travel-intelligence-mlops-streamlit:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8501

---

apiVersion: v1
kind: Service

metadata:
  name: streamlit
  namespace: travel-intelligence

spec:

  selector:
    app: streamlit

  ports:

    - port: 8501
      targetPort: 8501
      nodePort: 30001

  type: NodePort
