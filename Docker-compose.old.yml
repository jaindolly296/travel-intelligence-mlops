version: "3.9"

services:

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: travel-fastapi
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - fastapi