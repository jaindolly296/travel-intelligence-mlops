services:

  postgres:
    image: postgres:15
    container_name: travel-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5433:5432"

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    restart: unless-stopped

  airflow-init:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-init

    depends_on:
      - postgres

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname Dolly
      --lastname Singh
      --role Admin
      --email admin@example.com
      --password admin || true
      "

  airflow-webserver:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-webserver

    depends_on:
      - airflow-init

    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project

    ports:
      - "8081:8080"

    command: webserver

  airflow-scheduler:

    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: airflow-scheduler

    depends_on:
      - airflow-webserver

    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project

    command: scheduler

  fastapi:

    build:
      context: .
      dockerfile: Dockerfile.api

    container_name: travel-fastapi

    volumes:
      - ./:/app

    ports:
      - "8000:8000"

    restart: unless-stopped

  streamlit:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: travel-streamlit

    depends_on:
      - fastapi

    volumes:
      - ./:/app

    ports:
      - "8501:8501"

    restart: unless-stopped

  mlflow:

    build:
      context: .
      dockerfile: Dockerfile.mlflow

    container_name: travel-mlflow

    depends_on:
      - postgres

    working_dir: /app

    volumes:
      - ./:/app

    ports:
      - "5000:5000"

    command: >
      mlflow ui
      --backend-store-uri sqlite:///mlflow.db
      --host 0.0.0.0
      --port 5000

    restart: unless-stopped

volumes:
  postgres-db-volume:
